<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
<title id="title">Stream Clip Maker</title><desc id="desc">Stream chat reactions become highlighted vertical clips.</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#090D1A"/><stop offset=".55" stop-color="#111A35"/><stop offset="1" stop-color="#241B48"/></linearGradient>
<linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#67E8F9"/><stop offset=".55" stop-color="#398BFF"/><stop offset="1" stop-color="#8B5CF6"/></linearGradient>
<linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#202B4A"/><stop offset="1" stop-color="#151B31"/></linearGradient>
<filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="10" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="1200" height="420" rx="30" fill="url(#bg)"/><circle cx="1000" cy="30" r="230" fill="#6255E7" opacity=".1"/><circle cx="170" cy="410" r="250" fill="#2589FF" opacity=".1"/>
<g opacity=".12" stroke="#A5B4FC"><path d="M0 84H1200M0 168H1200M0 252H1200M0 336H1200"/><path d="M150 0V420M300 0V420M450 0V420M600 0V420M750 0V420M900 0V420M1050 0V420"/></g>
<g transform="translate(72 80)"><rect width="270" height="260" rx="24" fill="url(#panel)" stroke="#6477A8" stroke-opacity=".35"/><text x="26" y="42" fill="#DCE8FF" font-family="Arial,sans-serif" font-size="17" font-weight="700">LIVE CHAT</text>
<g font-family="Arial,sans-serif" font-size="16" fill="#C8D4F1"><rect x="24" y="64" width="222" height="38" rx="11" fill="#293653"/><circle cx="43" cy="83" r="7" fill="#67E8F9"/><text x="59" y="89">NO WAY!!</text><rect x="24" y="112" width="192" height="38" rx="11" fill="#293653"/><circle cx="43" cy="131" r="7" fill="#A78BFA"/><text x="59" y="137">WHAT A PLAY</text><rect x="24" y="160" width="222" height="38" rx="11" fill="#293653"/><circle cx="43" cy="179" r="7" fill="#34D399"/><text x="59" y="185">CLIP THAT!</text></g>
<path d="M24 226H246" stroke="#526386" stroke-width="5" stroke-linecap="round"/><path d="M24 226H207" stroke="url(#blue)" stroke-width="5" stroke-linecap="round"/><circle cx="207" cy="226" r="8" fill="#67E8F9" filter="url(#glow)"/></g>
<g transform="translate(405 180)"><path d="M0 0H105" stroke="url(#blue)" stroke-width="4" stroke-linecap="round"/><path d="M91 -12L105 0L91 12" fill="none" stroke="#67E8F9" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="53" cy="0" r="28" fill="#398BFF" opacity=".12"/><path d="M48 -12L65 0L48 12Z" fill="#A5B4FC"/></g>
<g transform="translate(555 76)"><rect width="190" height="268" rx="26" fill="#10182D" stroke="url(#blue)" stroke-width="2"/><rect x="12" y="12" width="166" height="244" rx="18" fill="#202B4A"/><rect x="23" y="28" width="144" height="112" rx="12" fill="#344A72"/><path d="M23 112L61 74L89 99L117 59L167 108V140H23Z" fill="#5B78AE" opacity=".8"/><circle cx="124" cy="58" r="13" fill="#67E8F9" opacity=".85"/><path d="M88 69L112 84L88 99Z" fill="#EAF4FF"/><rect x="24" y="154" width="142" height="8" rx="4" fill="#91A5D1" opacity=".65"/><rect x="24" y="174" width="105" height="7" rx="3.5" fill="#6477A8" opacity=".7"/><rect x="24" y="198" width="142" height="34" rx="10" fill="#293A60"/><path d="M38 215H50L56 203L64 226L72 210L80 215H94L102 205L110 222L118 215H151" fill="none" stroke="url(#blue)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g>
<g transform="translate(790 80)"><text x="0" y="54" fill="#F8FAFF" font-family="Arial,sans-serif" font-size="44" font-weight="700" letter-spacing="-1.5">STREAM CLIP</text><text x="0" y="105" fill="url(#blue)" font-family="Arial,sans-serif" font-size="44" font-weight="700" letter-spacing="-1.5">MAKER</text><text x="2" y="150" fill="#C1CBE5" font-family="Arial,sans-serif" font-size="19">Find the moment.</text><text x="2" y="180" fill="#C1CBE5" font-family="Arial,sans-serif" font-size="19">Cut the highlight.</text><text x="2" y="210" fill="#C1CBE5" font-family="Arial,sans-serif" font-size="19">Share the clip.</text><g transform="translate(0 244)"><rect width="150" height="34" rx="17" fill="#27375E" stroke="#6278B5" stroke-opacity=".5"/><circle cx="18" cy="17" r="5" fill="#67E8F9"/><text x="33" y="22" fill="#E5EDFF" font-family="Arial,sans-serif" font-size="13" font-weight="700">CHAT-POWERED</text></g></g>
