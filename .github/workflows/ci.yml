name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality checks (Ubuntu / Node 22)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit dependencies
        run: pnpm audit --audit-level=high

      - name: Run project checks and CLI smoke tests
        run: pnpm test

      - name: Run project-owned Node.js tests
        shell: bash
        run: |
          test_files=()
          while IFS= read -r -d '' file; do
            test_files+=("$file")
          done < <(find . \
            -path './node_modules' -prune -o \
            -path './tools' -prune -o \
            -path './.git' -prune -o \
            -type f \
            \( -name '*.test.js' -o -name '*.test.mjs' -o -name '*.spec.js' -o -name '*.spec.mjs' \) \
            -print0)
          if (( ${#test_files[@]} == 0 )); then
            echo "No project-owned Node.js test files found; skipping test runner."
          else
            node --test "${test_files[@]}"
          fi

      - name: Check shell script syntax
        shell: bash
        run: |
          shopt -s nullglob
          scripts=( ./*.sh )
          if (( ${#scripts[@]} == 0 )); then
            echo "No shell scripts found; skipping."
          else
            bash -n "${scripts[@]}"
          fi

      - name: Build desktop frontend
        run: pnpm build

      - name: Check patch whitespace
        run: git diff --check HEAD^ HEAD
