name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality checks (Ubuntu / Node 22)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run project checks and CLI smoke tests
        run: npm test

      - name: Check shell script syntax
        shell: bash
        run: |
          shopt -s nullglob
          scripts=( ./*.sh )
          if (( ${#scripts[@]} == 0 )); then
            echo "No shell scripts found; skipping."
          else
            bash -n "${scripts[@]}"
          fi

      - name: Build desktop frontend
        run: npm run build

      - name: Check patch whitespace
        run: git diff --check HEAD^ HEAD

  desktop-compile:
    name: Desktop compile (${{ matrix.name }})
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            runner: ubuntu-22.04
            os: linux
          - name: Windows x64
            runner: windows-latest
            os: windows
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential curl wget file xdg-utils patchelf libfuse2 \
            libssl-dev libayatana-appindicator3-dev librsvg2-dev \
            libwebkit2gtk-4.1-dev libxdo-dev

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Bundle Node.js runtime (Linux)
        if: matrix.os == 'linux'
        shell: bash
        run: |
          mkdir -p src-tauri/resources/runtime
          cp "$(command -v node)" src-tauri/resources/runtime/node
          chmod 755 src-tauri/resources/runtime/node

      - name: Bundle Node.js runtime (Windows)
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force src-tauri/resources/runtime | Out-Null
          Copy-Item (Get-Command node).Source src-tauri/resources/runtime/node.exe

      - name: Compile Tauri desktop application
        run: npm run tauri -- build --no-bundle
