name: Desktop builds

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: desktop-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            runner: ubuntu-22.04
            os: linux
            args: ""
          - name: Windows x64
            runner: windows-latest
            os: windows
            args: ""

    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential curl wget file xdg-utils patchelf libfuse2 \
            libssl-dev libayatana-appindicator3-dev librsvg2-dev \
            libwebkit2gtk-4.1-dev libxdo-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Bundle Node.js runtime (Linux)
        if: matrix.os == 'linux'
        shell: bash
        run: |
          mkdir -p src-tauri/resources/runtime
          cp "$(command -v node)" src-tauri/resources/runtime/node
          chmod 755 src-tauri/resources/runtime/node

      - name: Bundle Node.js runtime (Windows)
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force src-tauri/resources/runtime | Out-Null
          Copy-Item (Get-Command node).Source src-tauri/resources/runtime/node.exe

      - name: Build and attach desktop installers
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: Stream Clip Maker v__VERSION__
          releaseBody: |
            Stream Clip Maker desktop preview, version 0.1.0.

            Download the installer for your operating system. See the README for setup requirements and external media tools.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
